<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8c8dc">
<title>Jiggle Clicker</title>
<link rel="icon" href="./icon.svg">
</head>
<body>
<div id="lvbar" title=""><span id="lvbadge">Lv 0</span><div id="lvtrack"><div id="lvfill"></div></div><span id="lvtxt"></span></div>
<div id="ui">
  <div id="count">0</div>
  <div id="cps">+0/s</div>
  <button id="upgrades">Upgrades</button><button id="wardrobeBtn">Wardrobe</button>
</div>
<div id="shop">
  <h2>Shop <button id="close">✕</button></h2>
  <h3>Click power</h3><div id="clickList"></div>
  <h3>Generators</h3><div id="genList"></div>
  <button id="reset">Reset progress</button>
</div>
<div id="wardrobe" class="panel">
  <h2>Wardrobe <button id="wclose">✕</button></h2>
  <div id="wardList"></div>
</div>
<button id="adminBtn" title="Admin">⚙</button>
<div id="admin"><div style="display:flex;gap:4px"><input id="adminAmt" type="number" min="0" placeholder="amount"><button id="adminAdd">Add</button></div>
<div><button data-add="1e3">+1K</button><button data-add="1e6">+1M</button><button data-add="1e9">+1B</button></div>
<div><button data-lv="-1">-1 Lv</button><button data-lv="1">+1 Lv</button><button data-lv="max">Max Lv</button></div></div>
<div id="toasts"></div>
<div id="backdrop"></div>
<canvas id="canvas"></canvas>
<script type="module" src="/src/main.js"></script>
</body></html>
